name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (airflow)
        id: meta_airflow
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/banking-airflow
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile-airflow.dockerfile
          push: true
          tags: ${{ steps.meta_airflow.outputs.tags }}
          labels: ${{ steps.meta_airflow.outputs.labels }}

      - name: Docker metadata (superset)
        id: meta_superset
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/banking-superset
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push superset image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile-superset.dockerfile
          push: true
          tags: ${{ steps.meta_superset.outputs.tags }}
          labels: ${{ steps.meta_superset.outputs.labels }}
