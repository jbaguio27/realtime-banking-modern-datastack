name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare env file for compose validation
        run: cp .env.example .env

      - name: Validate docker compose
        run: docker compose -f docker-compose.yaml config > /dev/null

      - name: Python syntax check
        run: |
          python -m pip install --upgrade pip
          git ls-files '*.py' | xargs -r python -m py_compile

      - name: Validate dbt project structure
        run: |
          test -f banking_dbt/dbt_project.yml
          test -f banking_dbt/profiles.yml
          test -d banking_dbt/models

      - name: Guard against hardcoded dbt credentials
        run: |
          ! grep -E "^[[:space:]]*password:[[:space:]]*['\"]?[A-Za-z0-9]" banking_dbt/profiles.yml
          ! grep -E "^[[:space:]]*account:[[:space:]]*[A-Za-z0-9]" banking_dbt/profiles.yml

      - name: Guard against committed runtime state
        run: |
          ! git ls-files | grep -E '^docker/postgres/data/'
          ! git ls-files | grep -E '^docker/minio/data/'
          ! git ls-files | grep -E '^docker/logs/'
          ! git ls-files | grep -E '^logs/'
